<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- iOS home-screen app -->
  <meta name="theme-color" content="#f5f7fa" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hnah Finance" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

  <!-- Apply theme before first paint to avoid a light flash in dark mode.
       Keep colors in sync with --bg in src/index.css and src/lib/theme.ts. -->
  <script>
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('theme') || 'system'; } catch (e) { }
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b0e14' : '#f5f7fa');
    })();
  </script>
  <title>Hnah Finance</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
